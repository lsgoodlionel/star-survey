name: Survey images · reusable read-only build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.id }} without registry access
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: admin
            context: platform/apps/admin-web
            file: platform/apps/admin-web/Dockerfile
            image: star-survey-admin
          - id: platform
            context: platform/services/business
            file: platform/services/business/Dockerfile
            image: star-survey-platform
          - id: publish-gateway
            context: platform/tools/publish-gateway
            file: platform/tools/publish-gateway/Dockerfile
            image: star-survey-publish-gateway
          - id: engine
            context: .
            file: platform/deploy/production/Dockerfile.engine
            image: star-survey-engine
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Read deterministic source timestamp
        id: source
        shell: bash
        run: echo "created=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Build local multi-architecture OCI archive
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/${{ matrix.id }}.tar
          tags: local/star-survey/${{ matrix.image }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.source.outputs.created }}
          pull: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

      - name: Validate local archive and digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -s "/tmp/${{ matrix.id }}.tar"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

