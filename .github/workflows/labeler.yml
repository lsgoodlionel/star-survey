name: PR · 标签与冲突管理

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  pull-requests: write
  issues: write
  contents: read

concurrency:
  group: pr-labels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  labels:
    name: 更新待办与冲突标签
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # No checkout: PR code must not run with the label-writing token.
      - name: 同步标签（状态未知时保留原冲突标签）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import time
          import urllib.error
          import urllib.request

          def api(path, method='GET', data=None):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/' + path,
                  data=json.dumps(data).encode() if data is not None else None,
                  method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  if method == 'DELETE' and error.code == 404:
                      return None  # Already absent; other permission/API errors remain failures.
                  raise RuntimeError(f'Label API failed: HTTP {error.code}') from None

          def sync(number):
              number = int(number)
              for attempt in range(12):
                  state = api(f'pulls/{number}').get('mergeable_state')
                  if state not in {None, '', 'unknown'}:
                      break
                  time.sleep(5)
              if state == 'dirty':
                  api(f'issues/{number}/labels', 'POST', {'labels': ['Has conflicts']})
              elif state in {'clean', 'unstable', 'blocked', 'behind', 'has_hooks'}:
                  api(f'issues/{number}/labels/Has%20conflicts', 'DELETE')
              else:
                  print(f'PR #{number}: mergeability unknown; preserving conflict label')

          def main():
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
                  pr = event['pull_request']
                  number = int(pr['number'])
                  if not pr['draft'] and event['action'] in {'opened', 'ready_for_review'}:
                      api(f'issues/{number}/labels', 'POST',
                          {'labels': ['Needs code review', 'Needs testing']})
                  sync(number)
              else:
                  page = 1
                  while True:
                      prs = api(f'pulls?state=open&base=main&per_page=100&page={page}')
                      for pr in prs:
                          sync(pr['number'])
                      if len(prs) < 100:
                          break
                      page += 1

          if __name__ == '__main__':
              main()
          PY
