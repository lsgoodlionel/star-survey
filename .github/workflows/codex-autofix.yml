name: Survey - Codex 自动修复

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: "失败的质量闸门运行 ID"
        required: true
        type: string

permissions: {}

concurrency:
  group: codex-autofix-${{ github.event.workflow_run.head_branch || inputs.failed_run_id }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    outputs:
      decision: ${{ steps.state.outputs.decision }}
      attempt: ${{ steps.state.outputs.attempt }}
      next_attempt: ${{ steps.state.outputs.next_attempt }}
      branch: ${{ steps.state.outputs.branch }}
      sha: ${{ steps.state.outputs.sha }}
      pr: ${{ steps.state.outputs.pr }}
      run_id: ${{ steps.state.outputs.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 读取失败运行及提交标记
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PATH: ${{ github.event_path }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN_ID" > "$RUNNER_TEMP/failed-run.json"
            python3 - "$EVENT_PATH" "$RUNNER_TEMP/failed-run.json" > "$RUNNER_TEMP/event.json" <<'PY'
          import json, sys
          event = json.load(open(sys.argv[1]))
          event['workflow_run'] = json.load(open(sys.argv[2]))
          json.dump(event, sys.stdout)
          PY
          else
            cp "$EVENT_PATH" "$RUNNER_TEMP/event.json"
          fi
          sha=$(jq -r '.workflow_run.head_sha // empty' "$RUNNER_TEMP/event.json")
          if [ -n "$sha" ]; then git fetch --no-tags origin "$sha"; fi
          python3 platform/tools/ci-autofix/state.py "$RUNNER_TEMP/event.json" > "$RUNNER_TEMP/state.json"
          for key in decision attempt next_attempt branch sha pr run_id; do
            value=$(jq -r --arg key "$key" '.[$key] // empty' "$RUNNER_TEMP/state.json")
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

  prepare:
    needs: decide
    if: needs.decide.outputs.decision == 'fix'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.decide.outputs.sha }}
          persist-credentials: false
      - name: 读取失败步骤日志并限定文件
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.decide.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --log-failed > "$RUNNER_TEMP/failure.log"
          test -s "$RUNNER_TEMP/failure.log"
          python3 platform/tools/ci-autofix/scope.py "$RUNNER_TEMP/failure.log" "$RUNNER_TEMP/scope"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-scope-${{ needs.decide.outputs.run_id }}
          path: ${{ runner.temp }}/scope/
          if-no-files-found: error
          retention-days: 7

  fix:
    needs: [decide, prepare]
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      # 这个 job 不检出仓库，只下载已圈定的文件和失败报告。
      - uses: actions/download-artifact@v4
        with:
          name: codex-scope-${{ needs.decide.outputs.run_id }}
      - name: 固定隔离基线
        run: |
          set -euo pipefail
          git init -q
          git config user.name 'survey-codex-autofix'
          git config user.email 'survey-codex-autofix@users.noreply.github.com'
          git add -A
          git commit -qm 'baseline: scoped CI repair input'
      - name: Codex 仅修改失败文件
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          allow-bots: true
          prompt-file: codex-prompt.txt
      - name: 校验修改范围并保存补丁
        run: |
          set -euo pipefail
          git diff --check
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          python3 - <<'PY_SCOPE'
          from pathlib import Path
          import subprocess
          allowed = set(Path('allowed-files.txt').read_text().splitlines())
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().strip('\0').split('\0'))
          if not changed or not changed <= allowed:
              raise SystemExit(f'Codex 修改超出失败文件范围：{sorted(changed - allowed)}')
          statuses = subprocess.check_output(['git', 'diff', '--name-status']).decode().splitlines()
          if any(not line.startswith('M\t') for line in statuses):
              raise SystemExit('只允许修改现有失败文件')
          PY_SCOPE
          git diff --binary > fix.patch
          test -s fix.patch
      - uses: actions/upload-artifact@v4
        with:
          name: codex-fix-${{ needs.decide.outputs.run_id }}
          path: fix.patch
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [decide, prepare, fix]
    if: needs.fix.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.decide.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: codex-fix-${{ needs.decide.outputs.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: codex-scope-${{ needs.decide.outputs.run_id }}
          path: ${{ runner.temp }}/scope
      - name: 验证目标 PR 和补丁
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.decide.outputs.pr }}
          BRANCH: ${{ needs.decide.outputs.branch }}
          SHA: ${{ needs.decide.outputs.sha }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --json headRefName,headRefOid,headRepositoryOwner,baseRefName,state > "$RUNNER_TEMP/pr.json"
          jq -e --arg branch "$BRANCH" --arg sha "$SHA" --arg owner "${GITHUB_REPOSITORY%/*}" '
            .state == "OPEN" and .headRefName == $branch and
            .headRefOid == $sha and .headRepositoryOwner.login == $owner and
            .baseRefName != $branch
          ' "$RUNNER_TEMP/pr.json"
          git apply --check fix.patch
          git apply fix.patch
          git diff --check
          python3 - <<'PY_SCOPE'
          from pathlib import Path
          import subprocess
          allowed = set(Path('${{ runner.temp }}/scope/allowed-files.txt').read_text().splitlines())
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().strip('\0').split('\0'))
          statuses = subprocess.check_output(['git', 'diff', '--name-status']).decode().splitlines()
          if not changed or not changed <= allowed or any(not line.startswith('M\t') for line in statuses):
              raise SystemExit('补丁超出失败文件范围')
          PY_SCOPE
      - name: 推送带次数标记的修复提交
        env:
          PUSH_TOKEN: ${{ secrets.SURVEY_AUTOFIX_PUSH_TOKEN }}
          BRANCH: ${{ needs.decide.outputs.branch }}
          SHA: ${{ needs.decide.outputs.sha }}
          ATTEMPT: ${{ needs.decide.outputs.next_attempt }}
          RUN_ID: ${{ needs.decide.outputs.run_id }}
        run: |
          set -euo pipefail
          test -n "$PUSH_TOKEN"
          git config user.name 'survey-codex-autofix'
          git config user.email 'survey-codex-autofix@users.noreply.github.com'
          git add -u
          git commit -m "fix(ci): Codex 自动修复 [codex-fix-attempt: $ATTEMPT]" -m "Failed CI run: $RUN_ID"
          printf 'https://x-access-token:%s@github.com\n' "$PUSH_TOKEN" > "$RUNNER_TEMP/git-credentials"
          chmod 600 "$RUNNER_TEMP/git-credentials"
          trap 'rm -f "$RUNNER_TEMP/git-credentials"' EXIT
          git -c credential.helper="store --file=$RUNNER_TEMP/git-credentials" push origin "HEAD:refs/heads/$BRANCH"

  report:
    needs: [decide, prepare, fix, publish]
    if: always() && needs.decide.outputs.decision != 'skip' && (needs.decide.outputs.decision == 'report' || needs.prepare.result == 'failure' || needs.fix.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.decide.outputs.sha }}
          fetch-depth: 5
          persist-credentials: false
      - name: 报告失败并停止自动修复
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.decide.outputs.pr }}
          RUN_ID: ${{ needs.decide.outputs.run_id }}
        run: |
          set -euo pipefail
          {
            echo 'Codex 自动修复已停止；两次上限、无法限定失败文件或修复/推送失败。请开发者人工介入。不会自动合并。'
            echo
            echo "当前失败运行：https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
            echo
            echo '最近失败日志摘要：'
            ids="$RUN_ID $(git log -3 --format=%B | sed -n 's/^Failed CI run: \([0-9][0-9]*\)$/\1/p' | head -2)"
            for id in $ids; do
              echo
              echo "运行 $id："
              gh run view "$id" --log-failed 2>/dev/null | head -c 2000 || true
              echo
            done
          } > "$RUNNER_TEMP/report.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/report.md"
