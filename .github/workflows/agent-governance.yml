name: agent-governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  agent-governance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Validate Harness configuration
        run: scripts/agent-harness --python -m unittest discover -s tools/agent-harness/tests -p 'test_config.py' -v

      - name: Run Harness unit and integration tests
        run: scripts/agent-harness --python -m unittest discover -s tools/agent-harness/tests -p 'test_*.py' -v

      - name: Run deterministic fault drills
        run: python3 tools/agent-harness/drills/run_drills.py

      - name: Scan governed commands for forbidden options
        run: python3 tools/agent-harness/drills/run_drills.py --check-forbidden-options

      - name: Check plan and memory references
        run: >-
          python3 tools/agent-harness/drills/run_drills.py --check-docs
          --plan docs/superpowers/plans/2026-10-10-autonomous-engineering-control-plane.md
          --memory docs/agent/PROJECT_MEMORY.md
