name: Trusted fixture compensation regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, loss-before, loss-after, consumed, expired, wrong-hash, wrong-handoff, wrong-principal, wrong-connection, wrong-tenant, missing, cleaned]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: python3 -B -m unittest discover -s platform/deploy/production/release/tests -p test_fixture_compensation_builder.py -q
      - run: docker pull postgres:16-alpine
      - run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY python3 -B scratch/exclusive_probe.py '${{ matrix.mode }}'
