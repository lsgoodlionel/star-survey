    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: python3 -B -m unittest discover -s scratch -p 'test_candidate_stop_*.py' -v
