name: Candidate stop guard fault injection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: python3 -B -m unittest discover -s scratch -p 'test_candidate_stop_*.py' -v
      - run: docker pull postgres:16-alpine
      - run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY python3 -B platform/deploy/production/release/tests/check_fixture_pinned_database.py
