name: Prepared transaction isolated diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: docker pull postgres:16-alpine
      - run: python3 -m unittest discover -s platform/deploy/production/release/tests -p test_prepared_diagnostics.py -v
      - run: python3 platform/deploy/production/release/tests/check_prepared_transaction.py
