name: Isolated fixture database precheck
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    services:
      fixture-db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate local fixture guard unit tests
        run: python3 -m unittest discover -s platform/deploy/production/release/tests -p 'test_fixture*.py' -q
      - name: Exercise database gate
        env:
          FIXTURE_PG_PORT: ${{ job.services.fixture-db.ports[5432] }}
        run: python3 platform/deploy/production/release/tests/check_database_gate.py
      - name: Exercise migrated compensation
        env:
          FIXTURE_PG_PORT: ${{ job.services.fixture-db.ports[5432] }}
        run: python3 platform/deploy/production/release/tests/check_fixture_compensation.py
