name: Isolated handoff concurrency check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    services:
      platform-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PLATFORM_DB_URL: jdbc:postgresql://localhost:5432/platform
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Initialize isolated database roles
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f platform/deploy/platform-dev/init-db.sql
      - name: Test production handoff concurrency
        run: platform/deploy/platform-dev/mvn-local.sh -Dtest=OrgLoginHandoffTest test
