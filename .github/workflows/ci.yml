name: Prepared transaction single-runner diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    services:
      fixture-db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only-password
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run original prepared test with synthetic stderr retained
        run: python3 platform/deploy/production/release/tests/check_prepared_transaction.py
