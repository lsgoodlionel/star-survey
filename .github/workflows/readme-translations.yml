name: README translations

on:
  push:
    branches: [feat/admin-product-alignment]
    paths: [README.md]

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Generate English and Japanese drafts
        uses: ikhsan3adi/markdown-translator@629de65807486cf6ad68605cd03728da7cc90fbd # v3.0.0
        with:
          LANG: |
            en
            ja
          FILES: README.md
          INCREMENTAL: false
          COMMIT: false
          PUSH: false
          IGNORE_PATTERN: |
            ^(?:Survey|LimeSurvey)$
      - name: Check translated structure and links
        run: python3 scripts/docs/check_readme_translations.py
      - name: Open translation review PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: feat/admin-product-alignment
          branch: docs/readme-i18n-sync
          add-paths: |
            README.en.md
            README.ja.md
          commit-message: 'docs: refresh README translation drafts'
          title: 'docs: review generated README translations'
          body: |
            Machine-generated drafts from the current Chinese README.
            Review technical facts, language, links, and commands before merging.
          delete-branch: true
