name: Ownership single-case sampling (no candidate)
on:
  workflow_dispatch:
    inputs:
      expected_execution_sha:
        description: Exact independently reviewed diagnostic-branch commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  ownership-health-sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Initialize bounded unknown evidence
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/ownership-sampling-isolated-pycache"
          printf 'PYTHONPYCACHEPREFIX=%s\n' "$PYTHONPYCACHEPREFIX" >> "$GITHUB_ENV"
          mkdir -m 0700 "$PYTHONPYCACHEPREFIX"
          mkdir -m 0700 "$RUNNER_TEMP/ownership-health-evidence"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'ownership-health-evidence/sampling.json'
          path.write_text(json.dumps({'schemaVersion': 1, 'scope': 'ownership-health-sampling',
              'samplingStatus': 'unknown', 'cleanupVerified': False, 'entireSuitePassed': False,
              'candidateQualified': False, 'restorationEligible': False, 'releaseEligible': False}) + '\n')
          PY
      - name: Install the existing pinned workflow parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Thin-entry contracts only (no Docker)
        run: python3 -B -m unittest discover -s platform/deploy/production/tests -p test_ownership_health_sampling.py
      - name: One existing backup-purge case with unchanged assertions
        env:
          EXPECTED_EXECUTION_SHA: ${{ inputs.expected_execution_sha }}
        run: |
          set -euo pipefail
          python3 -B platform/deploy/production/tests/integration/ownership_health_sampling.py \
            --expected-execution-sha "$EXPECTED_EXECUTION_SHA" \
            --report "$RUNNER_TEMP/ownership-health-evidence/sampling.json"
      - name: Preserve only bounded sampling JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ownership-health-sampling-amd64
          path: ${{ runner.temp }}/ownership-health-evidence/sampling.json
          if-no-files-found: error
