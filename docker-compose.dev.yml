# Local development stack
#   dev:  docker compose -f docker-compose.dev.yml up -d
#   test: platform/deploy/test/run-tests.sh [--fresh] [phpunit args]
#         TEST_DB=pgsql platform/deploy/test/run-tests.sh ...  (PostgreSQL 16)
services:
  web:
    build: ./platform/deploy/dev
    image: survey-web
    container_name: survey-web
    ports:
      - "${WEB_PORT:-8090}:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: mariadb:10.11
    container_name: survey-db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: limesurvey
      MARIADB_USER: limesurvey
      MARIADB_PASSWORD: ${DB_PASSWORD:-limesurvey}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - survey-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  # Isolated test stack mirroring .github/workflows/functional.yml:
  # root/root DB account, admin/password superadmin, debug=0, own tmp dir.
  test-db:
    profiles: ["test"]
    image: mariadb:10.11
    container_name: ${SURVEY_TEST_PREFIX:-survey}-test-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: limesurvey
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  test-pg:
    profiles: ["test"]
    image: postgres:16-alpine
    container_name: ${SURVEY_TEST_PREFIX:-survey}-test-pg
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: limesurvey
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "limesurvey"]
      interval: 5s
      retries: 20

  test-web:
    profiles: ["test"]
    image: survey-web
    container_name: ${SURVEY_TEST_PREFIX:-survey}-test-web
    environment:
      ENGINE_DB_ROOT_PASSWORD: root
    volumes:
      - ./:/var/www/html
      - ./platform/deploy/test/.runtime/config.php:/var/www/html/application/config/config.php
      - test-tmp:/var/www/html/tmp
      # TEST ONLY fault injection plugin (P0-00.4); never mounted in dev or prod.
      - ./platform/tests/fixtures/plugins/FaultInjector:/var/www/html/plugins/FaultInjector:ro
    depends_on:
      test-db:
        condition: service_healthy

  # Optional local AI sandbox. It is never part of the default dev/test stacks
  # and is not referenced by production deployment files.
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    container_name: survey-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  survey-db:
  test-tmp:
  ollama-data:
