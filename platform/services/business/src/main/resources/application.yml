# 运行期以 platform_app 连接（受行级安全约束）；迁移以 platform_owner 执行。
# 口令一律来自环境变量，这里的默认值只用于本地开发库。
spring:
  application:
    name: mjy-platform-business
  datasource:
    url: ${PLATFORM_DB_URL:jdbc:postgresql://localhost:5433/platform}
    username: ${PLATFORM_DB_APP_USER:platform_app}
    password: ${PLATFORM_DB_APP_PASSWORD:platform_app}
  flyway:
    url: ${PLATFORM_DB_URL:jdbc:postgresql://localhost:5433/platform}
    user: ${PLATFORM_DB_OWNER_USER:platform_owner}
    password: ${PLATFORM_DB_OWNER_PASSWORD:platform_owner}
    # 迁移按模块分号段（见 CONVENTIONS.md），各模块互相独立；某模块在低号段追加迁移时，
    # 已跑过高号段的库需要能补跑它，因此允许乱序。
    out-of-order: true

management:
  endpoints:
    web:
      exposure:
        include: health

platform:
  security:
    # 必须由环境变量提供，至少 32 字节；缺失时应用拒绝启动。
    jwt-hmac-secret: ${PLATFORM_JWT_HMAC_SECRET:}
  # 组织免登（企业微信 / 钉钉 / 飞书，ADR 0014）。平台对外 HTTPS 地址为空时免登一律 503。
  # 各租户应用密钥不在这里：按 PLATFORM_ORG_SECRET_<租户标识去横线大写>_<密钥名> 由环境或密钥库注入。
  # 开放平台地址默认即官方正式环境（*-api-base-url、*-authorize-url），一般无需配置。
  identity:
    org-login:
      callback-base-url: ${PLATFORM_PUBLIC_BASE_URL:}
      token-ttl: ${PLATFORM_ORG_LOGIN_TOKEN_TTL:PT10M}
      state-ttl: PT5M
    # 通讯录事件回调 /v1/org-events/{租户}/{连接}（ADR 0014 增补二）：Token 与加密密钥按连接的 eventTokenRef /
    # eventKeyRef 从 PLATFORM_ORG_SECRET_<租户>_<密钥名> 解析。请求体上限与时间戳窗口如下。
    org-events:
      max-body-bytes: ${PLATFORM_ORG_EVENTS_MAX_BODY_BYTES:65536}
      max-clock-skew: ${PLATFORM_ORG_EVENTS_MAX_CLOCK_SKEW:PT5M}
    # 匿名端点（事件回调、免登 start / callback）的进程内限流：在验签与读请求体之前判定，超限即 429。
    # 两层桶都按来源地址分，因此一个来源的噪声挤不掉另一个来源的额度；验签通过的回调把令牌退回
    # 未验签的桶，改记在「已验签」额度上，攻击者锁不死租户的真实回调。来源地址取直连对端，
    # 不认 X-Forwarded-For：部署在反向代理后面时须由代理或入口层提供真实地址。
    rate-limit:
      enabled: ${PLATFORM_ORG_RATE_LIMIT_ENABLED:true}
      per-connection-per-minute: ${PLATFORM_ORG_RATE_LIMIT_PER_CONNECTION:60}
      per-source-per-minute: ${PLATFORM_ORG_RATE_LIMIT_PER_SOURCE:300}
      verified-per-connection-per-minute: ${PLATFORM_ORG_RATE_LIMIT_VERIFIED:600}
      max-buckets: ${PLATFORM_ORG_RATE_LIMIT_MAX_BUCKETS:20000}
      retry-after-seconds: ${PLATFORM_ORG_RATE_LIMIT_RETRY_AFTER:60}
    # 定时全量组织同步：默认关闭。只在开放平台明确答复"离职 / 禁用 / 不存在"时撤权。
    org-sync:
      enabled: ${PLATFORM_ORG_SYNC_ENABLED:false}
      interval: ${PLATFORM_ORG_SYNC_INTERVAL:PT6H}
      initial-delay: PT10M
      batch-size: ${PLATFORM_ORG_SYNC_BATCH_SIZE:200}
  # 发布网关（契约 platform/contracts/publish-gateway-v1.md 及 v1.2 增补）。密钥至少 32 字节，与网关侧 PUBGW_SHARED_SECRET 相同；
  # 缺失时应用照常启动，但问卷发布一律 503（失败即关闭）。
  pubgw:
    url: ${PLATFORM_PUBGW_URL:}
    secret: ${PLATFORM_PUBGW_SECRET:}
    # 须大于网关跑完七个阶段所需的时间；超时只代表"结果未知"，之后以同一 requestId 核对。
    timeout-seconds: ${PLATFORM_PUBGW_TIMEOUT_SECONDS:120}
  # 待核对发布的后台核对（PublishReconciler）：用同一 requestId 原样重发，靠网关幂等拿到确定结局。
  survey:
    reconcile:
      enabled: ${PLATFORM_SURVEY_RECONCILE_ENABLED:true}
      interval: ${PLATFORM_SURVEY_RECONCILE_INTERVAL:PT1M}
      initial-delay: PT30S
      batch-size: ${PLATFORM_SURVEY_RECONCILE_BATCH_SIZE:50}
      max-attempts: ${PLATFORM_SURVEY_RECONCILE_MAX_ATTEMPTS:8}
      backoff-initial: PT1M
      backoff-max: PT30M
    # 在线版本的定时漂移巡检（ADR 0012）：只读引擎、只记录与告警，绝不自动覆盖。默认关闭；按需检查不受影响。
    drift-check:
      enabled: ${PLATFORM_SURVEY_DRIFT_CHECK_ENABLED:false}
      interval: ${PLATFORM_SURVEY_DRIFT_CHECK_INTERVAL:PT15M}
      initial-delay: PT2M
      recheck-after: ${PLATFORM_SURVEY_DRIFT_CHECK_RECHECK_AFTER:PT6H}
      batch-size: ${PLATFORM_SURVEY_DRIFT_CHECK_BATCH_SIZE:100}
  # 答卷导出作业（ADR 0015）。文件先落本地目录（多副本需共享卷，生产换对象存储实现），到期即删。
  response:
    export:
      enabled: ${PLATFORM_RESPONSE_EXPORT_ENABLED:true}
      interval: ${PLATFORM_RESPONSE_EXPORT_INTERVAL:PT10S}
      initial-delay: PT20S
      storage-dir: ${PLATFORM_RESPONSE_EXPORT_DIR:}
      retention: ${PLATFORM_RESPONSE_EXPORT_RETENTION:PT72H}
      batch-size: 500
      lease: PT5M
      max-attempts: 5
      backoff: PT1M
