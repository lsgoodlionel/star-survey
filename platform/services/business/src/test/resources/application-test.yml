spring:
  datasource:
    hikari:
      # Spring 测试会缓存多个应用上下文，每个都有自己的连接池；默认 10 个连接乘以上下文数，
      # 再加上并行车道共用同一个 PostgreSQL，会耗尽 max_connections。测试里用小池并及时回收空闲连接。
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 10000
platform:
  security:
    jwt-hmac-secret: test-only-secret-that-is-at-least-32-bytes-long
  identity:
    # 测试里不启动定时组织同步，由测试直接调用 OrgDirectorySyncService.runScheduledRound()。
    org-sync:
      enabled: false
  survey:
    reconcile:
      # 测试里不启动定时调度，由测试直接调用 PublishReconciler.runOnce()。
      enabled: false
      max-attempts: 3
      batch-size: 1000
    drift-check:
      # 测试里不启动定时巡检，由测试直接调用 SurveyDriftService。
      enabled: false
  response:
    export:
      # 测试里不启动定时调度，由测试直接调用 ResponseExportWorker；失败立即可重试。
      enabled: false
      backoff: PT0S
      storage-dir: target/test-exports
