server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /v1/preview/access {
        proxy_pass ${GATEWAY_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://test-web/ /survey/;
    }

    location = /v1 {
        proxy_pass ${PLATFORM_UPSTREAM};
        proxy_read_timeout 190s;
    }

    location ^~ /v1/ {
        proxy_pass ${PLATFORM_UPSTREAM};
        proxy_read_timeout 190s;
    }

    location ^~ /d/ {
        proxy_pass ${PLATFORM_UPSTREAM};
    }

    location ^~ /a/ {
        proxy_pass ${PLATFORM_UPSTREAM};
    }

    location = /survey {
        return 308 /survey/;
    }

    location ^~ /survey/ {
        rewrite ^/survey/(.*)$ /$1 break;
        proxy_pass ${ENGINE_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /survey;
        proxy_redirect off;
    }

    location ~ ^/(?:index\.php|tmp|themes|upload)/ {
        proxy_pass ${ENGINE_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location = /actuator/health {
        proxy_pass ${PLATFORM_UPSTREAM}/actuator/health;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
