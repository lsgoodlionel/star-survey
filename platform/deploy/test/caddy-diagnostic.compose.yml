# Dedicated hosted-runner diagnostic only; uses the production Caddyfile.
services:
  test-web:
    networks:
      default:
        aliases: [engine]
  gateway:
    networks:
      default:
        aliases: [publish-gateway]
  diagnostic-edge:
    image: caddy:2.11.6-alpine
    entrypoint: ["/bin/sh", "/opt/survey/start-edge.sh"]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      PUBLIC_HOST: http://127.0.0.1:8088
      CADDY_TLS_DIRECTIVE: ""
      ENGINE_ADMIN_USER: fixture
      ENGINE_ADMIN_PASSWORD_HASH_FILE: /run/secrets/engine_admin_password_hash
    ports:
      - "127.0.0.1:${ADMIN_WEB_PUBLIC_PORT:?set public port}:8088"
    volumes:
      - ./platform/deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./platform/deploy/production/init/start-edge.sh:/opt/survey/start-edge.sh:ro
      - ./platform/deploy/production/tests/fixtures/secrets/engine_admin_hash:/run/secrets/engine_admin_password_hash:ro
    depends_on: [admin-web, gateway, test-web]
