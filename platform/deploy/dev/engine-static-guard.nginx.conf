# 引擎静态文件的服务器级防护，nginx 版（ADR 0020）。
# 与同目录的 engine-static-guard.conf 一一对应；nginx 根本不读 .htaccess，
# 所以换 nginx 部署时**必须**把本文件 include 进引擎的 server 块，否则
# 知道 sid 与存储名即可匿名下载他人答卷附件（P0 发现 11）。
#
#   server {
#       root /var/www/html;
#       autoindex off;                      # nginx 的默认值，写出来当作声明
#       include /etc/nginx/snippets/engine-static-guard.conf;
#       ...
#   }
#
# 匹配顺序（nginx 的规则，写错了等于没防）：
#   1. `^~` 前缀一旦命中**就不再看正则**；
#   2. 否则正则按出现顺序匹配，胜过普通前缀。
# 因此附件的按名拒绝写成正则，且 upload/ 下**不要**用 `^~` 前缀——那会把正则短路掉。
# 本文件要放在承载 PHP 的 `location ~ \.php$` **之前**。

# ---------------------------------------------------------------- 答卷附件
# 已提交的附件（fu_）与在途上传（futmp_）：无论落在 upload/ 的哪一层都不对外。
# 对应引擎自带 upload/surveys/.htaccess 的 ^fu_[a-z0-9_]*$，外加 futmp_。
# `~*` 是大小写不敏感的正则：大小写不敏感的文件系统上 FU_abc 照样能取到 fu_abc。
# `(.*/)?` 让 upload/ 顶层的同名文件也算数，与 Apache 版的 <DirectoryMatch> 覆盖面一致。
location ~* "^/upload/(.*/)?(fu_|futmp_)[^/]*$" {
    return 403;
}

# ---------------------------------------------------------------- 运行时目录
# tmp/ 下只有 assets 是公开的（Yii 把前端 JS/CSS 发布到 tmp/assets）。
# 其余（tmp/upload/ 在途上传、tmp/runtime/ 的日志与缓存、tcpdf 缓存）一律不对外。
# assets 那条更长，因此优先命中；它用 `^~` 正是为了短路上面那条按名拒绝的正则
# （发布出来的前端资源不会叫 fu_，但短路掉更省事也更确定）。
location ^~ /tmp/assets/ {
}

location ^~ /tmp/ {
    return 403;
}
