# 引擎静态文件的**服务器级**防护（ADR 0020；P0 发现 11、ADR 0002 已知限制第 3 条）。
#
# 为什么不能只靠 .htaccess：
#   引擎自带 upload/surveys/.htaccess（只拦 ^fu_[a-z0-9_]*$）与 tmp/runtime/.htaccess，
#   但 .htaccess 是 Apache 特有的，而且只在 AllowOverride 打开时才被读取。
#   Debian 的 apache2.conf 对 /var/www/ 默认就是 AllowOverride None——本镜像之所以生效，
#   纯粹因为上游 php:8.3-apache 的 conf-enabled/docker-php.conf 又把它设回了 All。
#   换 nginx、或有人收紧 AllowOverride，知道 sid 与存储名即可**匿名下载他人答卷附件**。
#
# 本文件放在服务器配置里（conf-enabled/），AllowOverride 与 .htaccess 都不影响它。
# nginx 部署用同目录的 engine-static-guard.nginx.conf。
#
# 判据是**文件名**，与引擎自己的约定一致（UploaderController.php:187 生成 futmp_<随机>_<ext>，
# em_manager_helper.php:8809 在提交时改成 fu_<随机>）：答卷附件与问卷资源落在同一个
# upload/surveys/<sid>/files/ 目录里，只有前者是作答者的个人数据，后者（题干里引用的
# PDF、图片）必须保持公开。因此只能按名字分，不能按目录分。

# ---------------------------------------------------------------- 答卷附件
<DirectoryMatch "^/var/www/html/upload(/|$)">
    # 目录列举永远关掉：附件名是随机串，能列目录等于把名字送出去。
    # MultiViews 一并关掉：内容协商会让 fu_abc 这个请求命中 fu_abc.pdf，
    # 把按名拒绝绕过去（引擎自带的根 .htaccess 也关它，但那份同样依赖 AllowOverride）。
    Options -Indexes -MultiViews
    # 已提交的附件（fu_）与在途上传（futmp_，正常落在 tmp/upload/，这里兜一层）。
    # (?i) 不是多余的：大小写不敏感的文件系统（开发机的 macOS 卷）上，
    # GET .../FU_abc 照样能取到 fu_abc，大小写敏感的规则就成了摆设。
    <FilesMatch "(?i)^(fu_|futmp_)">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

# ---------------------------------------------------------------- 运行时目录
# tmp/ 下只有 assets 是公开的：Yii 把前端 JS/CSS 发布到 tmp/assets
# （LSYii_Application.php:117-127，tempurl + '/assets'）。其余一律不对外——
# tmp/upload/ 是在途上传的附件，tmp/runtime/ 是 application.log / plugin.log 与缓存，
# tcpdf 的缓存目录也在 tmp/ 下。
<Directory "/var/www/html/tmp">
    Options -Indexes
    Require all denied
</Directory>
<Directory "/var/www/html/tmp/assets">
    Require all granted
</Directory>
